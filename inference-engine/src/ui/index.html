<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Axon Console</title>
  <link rel="stylesheet" href="/ui/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Cpath d='M8 23 16 8l8 15M11.5 18h9' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">A</span>
      <span class="brand-name">Axon</span>
      <span class="brand-sub">Console</span>
    </div>
    <div class="status" id="server-status" role="status">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">connecting…</span>
    </div>
    <div class="spacer"></div>
    <form class="keyform" id="key-form" autocomplete="off">
      <label for="api-key" class="sr-only">API key</label>
      <input id="api-key" type="password" placeholder="API key (if enabled)" spellcheck="false">
      <button type="submit" class="btn btn-ghost">Use key</button>
    </form>
  </header>

  <main class="layout">
    <aside class="sidebar" aria-label="Models">
      <div class="sidebar-head">
        <h2>Models</h2>
        <span class="count" id="model-count"></span>
      </div>
      <input id="filter" class="search" type="search" placeholder="Filter models…" spellcheck="false">
      <ul class="model-list" id="model-list"></ul>
      <p class="hint" id="list-hint"></p>
    </aside>

    <section class="content" id="content" aria-live="polite">
      <div class="empty">
        <h1>Select a model</h1>
        <p>Pick a model on the left to see its schema and try an inference.</p>
      </div>
    </section>
  </main>

  <script src="/ui/app.js"></script>
</body>
</html>
