# GPU variant of deployment.yaml. Requires the NVIDIA device plugin
# (or GPU Operator) so that `nvidia.com/gpu` is schedulable.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-server-gpu
  labels:
    app: inference-server-gpu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-server-gpu
  template:
    metadata:
      labels:
        app: inference-server-gpu
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: axon-server
          image: mustafa12/axon:0.4.0-gpu
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 8000
              name: http
            - containerPort: 8001
              name: grpc
            - containerPort: 8002
              name: metrics
          args:
            - "--model-repository=/models"
            - "--model-control-mode=poll"
            - "--repository-poll-secs=30"
            - "--http-port=8000"
            - "--grpc-port=8001"
            - "--metrics-port=8002"
            - "--num-threads=4"
            # KIND_AUTO models run on the GPU; KIND_CPU models stay on CPU.
            # Use --device=auto to fall back to CPU instead of failing.
            - "--device=cuda"
          env:
            # Optional: require `Authorization: Bearer <key>` on all
            # non-health endpoints. Create with:
            #   kubectl create secret generic axon-api-key --from-literal=key=<value>
            - name: AXON_API_KEY
              valueFrom:
                secretKeyRef:
                  name: axon-api-key
                  key: key
                  optional: true
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
              nvidia.com/gpu: 1
          startupProbe:
            httpGet:
              path: /v2/health/ready
              port: 8000
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v2/health/live
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: 8000
            initialDelaySeconds: 40
            periodSeconds: 10
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
            # readOnlyRootFilesystem: logs (/tmp/logs/axon) need a writable /tmp.
            - name: tmp
              mountPath: /tmp
      # Schedule onto GPU nodes (adjust to your cluster's labels/taints).
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: model-store-pvc
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: inference-server-gpu
  labels:
    app: inference-server-gpu
spec:
  type: ClusterIP
  selector:
    app: inference-server-gpu
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    - name: grpc
      port: 8001
      targetPort: 8001
    - name: metrics
      port: 8002
      targetPort: 8002
