name: turkish_safety_model
platform: onnxruntime_onnx
max_batch_size: 1

inputs:
  - name: input_ids
    data_type: TYPE_INT64
    dims: [1, -1]
  - name: attention_mask
    data_type: TYPE_INT64
    dims: [1, -1]

outputs:
  - name: logits
    data_type: TYPE_FP32
    dims: [1, 7]

# KIND_AUTO: CPU on a CPU server, GPU when started with --device=auto/cuda.
instance_groups:
  - count: 1
    kind: KIND_AUTO
