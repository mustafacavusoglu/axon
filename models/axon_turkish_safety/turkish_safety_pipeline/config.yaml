name: turkish_safety_pipeline
platform: ensemble
max_batch_size: 1

inputs:
  - name: text
    data_type: TYPE_STRING
    dims: [1]

outputs:
  - name: label
    data_type: TYPE_STRING
    dims: [1]
  - name: score
    data_type: TYPE_FP32
    dims: [1]

ensemble_scheduling:
  steps:
    - model_name: turkish_safety_tokenizer
      model_version: -1
      input_map:
        - key: text
          value: text
      output_map:
        - key: input_ids
          value: input_ids
        - key: attention_mask
          value: attention_mask

    - model_name: turkish_safety_model
      model_version: -1
      input_map:
        - key: input_ids
          value: input_ids
        - key: attention_mask
          value: attention_mask
      output_map:
        - key: logits
          value: logits

    - model_name: turkish_safety_decoder
      model_version: -1
      input_map:
        - key: logits
          value: logits
      output_map:
        - key: label
          value: label
        - key: score
          value: score

instance_groups:
  - count: 1
    kind: KIND_CPU
