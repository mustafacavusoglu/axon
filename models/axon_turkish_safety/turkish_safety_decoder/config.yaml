name: turkish_safety_decoder
platform: script
max_batch_size: 1

inputs:
  - name: logits
    data_type: TYPE_FP32
    dims: [1, 7]

outputs:
  - name: label
    data_type: TYPE_STRING
    dims: [1]
  - name: score
    data_type: TYPE_FP32
    dims: [1]

instance_groups:
  - count: 2
    kind: KIND_CPU
